<div class="app-shell">
  <header class="app-shell__topbar">
    <div class="app-shell__topbar-inner">
      <a routerLink="/produtos" class="app-shell__brand">
        <span class="app-shell__brand-name">KORP ERP</span>
        <span class="app-shell__brand-tag">Fiscal</span>
      </a>

      <nav class="app-shell__nav" aria-label="Navegação principal">
        @for (link of navLinks; track link.path) {
          <a
            class="app-shell__nav-link"
            [routerLink]="link.path"
            routerLinkActive="app-shell__nav-link--active"
            ariaCurrentWhenActive="page"
          >
            {{ link.label }}
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="app-shell__content" id="main-content">
    <div class="app-shell__paper">
      <router-outlet />
    </div>
  </main>
</div>
